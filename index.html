<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leasinglaufzeitende - LLE Popup</title>
  <link rel="stylesheet" href="lle-popup.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js" onload="window.__reactLoaded = true"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" onload="window.__reactDOMLoaded = true"></script>
  <script>
    // #region agent log
    window.addEventListener('error', function(e) {
      fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:error-handler',message:'Global error caught',data:{error:e.message,filename:e.filename,lineno:e.lineno},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'C'})}).catch(()=>{});
    });
    // #endregion
  </script>
</head>
<body>
  <div id="root"></div>

  <script>
    // Wrap everything to prevent immediate execution - only run when React is ready
    (function() {
      'use strict';
      
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:script-start',message:'Script execution started',data:{readyState:document.readyState,hasReact:typeof React!=='undefined'},timestamp:Date.now(),sessionId:'debug-session',runId:'run3',hypothesisId:'A'})}).catch(()=>{});
      // #endregion
      
      // Don't access React until we confirm it's loaded
      if (typeof React === 'undefined') {
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:react-check-fail',message:'React not available at script start, deferring',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run3',hypothesisId:'A'})}).catch(()=>{});
        // #endregion
        
        // Wait for React to load, then execute
        function waitForReact() {
          if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
            executeApp();
          } else {
            setTimeout(waitForReact, 50);
          }
        }
        waitForReact();
        return; // Exit early, will continue in executeApp()
      }
      
      executeApp();
      
      function executeApp() {
        // Ensure React is available before destructuring
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:executeApp-react-check',message:'React not available in executeApp, waiting',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run3',hypothesisId:'A'})}).catch(()=>{});
          // #endregion
          setTimeout(executeApp, 50);
          return;
        }
        
        const { useState, createElement: h, Fragment } = React;
      
      // Helper function to make React.createElement calls shorter
      const e = (tag, props, ...children) => {
        // Flatten children array if needed (for arrays from map)
        const flatChildren = children.length === 1 && Array.isArray(children[0]) ? children[0] : children;
        if (typeof tag === 'string') {
          return h(tag, props, ...flatChildren);
        }
        return h(tag, props, ...flatChildren);
      };

      const LLEPopup = () => {
        const [selectedOption, setSelectedOption] = useState(null);
        const [showConfirmation, setShowConfirmation] = useState(false);

        const colors = {
          weiterleasing: {
            primary: '#2563eb',
            dark: '#1d4ed8',
            light: '#eff6ff',
            gradient: 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)',
          },
          anschlussleasing: {
            primary: '#10b981',
            dark: '#059669',
            light: '#ecfdf5',
            gradient: 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
          },
          übernahmekauf: {
            primary: '#f59e0b',
            dark: '#d97706',
            light: '#fffbeb',
            gradient: 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
          },
          rückgabe: {
            primary: '#d4a5a5',
            dark: '#b08080',
            light: '#faf5f5',
            gradient: 'linear-gradient(135deg, #d4a5a5 0%, #c99494 100%)',
          },
        };

        const options = [
          {
            id: 'weiterleasing',
            title: 'Weiterleasing',
            badge: 'Empfohlen',
            highlighted: true,
            color: colors.weiterleasing,
            priceLabel: 'Monatliche Rate',
            price: '89,90 €',
            priceSuffix: '/ Monat',
            mainBenefit: 'Behalten Sie Ihr Fahrrad – nach 10 Monaten gehört es Ihnen ohne Ablöse',
            nettoRate: '~48 €',
            details: {
              laufzeit: '10 Monate',
              versicherung: 'Vollkasko inklusive',
              ablöse: '0 € – Fahrrad gehört nach 10 M. Ihnen',
              service: 'Reparatur & Wartung inklusive',
            },
          },
          {
            id: 'anschlussleasing',
            title: 'Anschlussleasing',
            badge: 'Günstigste',
            highlighted: false,
            color: colors.anschlussleasing,
            priceLabel: 'Monatliche Rate',
            price: '49,90 €',
            priceSuffix: '/ Monat',
            mainBenefit: 'Günstigere Rate – danach flexible Übernahme oder Rückgabe',
            nettoRate: '~27 €',
            details: {
              laufzeit: '24 Monate',
              versicherung: 'Vollkasko inklusive',
              ablöse: '299 € (optional)',
              service: 'Reparatur & Wartung inklusive',
            },
          },
          {
            id: 'übernahmekauf',
            title: 'Übernahmekauf',
            badge: null,
            highlighted: false,
            color: colors.übernahmekauf,
            priceLabel: 'Einmalzahlung',
            price: '890 €',
            priceSuffix: 'einmalig',
            mainBenefit: 'Das Fahrrad gehört Ihnen – sofort und ohne weitere Verpflichtungen',
            nettoRate: null,
            paymentInfo: 'Zahlung auf Rechnung in 14 Tagen',
            details: {
              laufzeit: 'Unbegrenzt (Eigentum)',
              versicherung: 'Endet mit Übernahme',
              ablöse: '890 € Restwert',
              service: 'Nicht inklusive',
            },
          },
        ];

        const handleContinue = () => {
          setShowConfirmation(true);
        };

        const handleBack = () => {
          setShowConfirmation(false);
          setSelectedOption(null);
        };

        const getSelectedColor = () => {
          if (selectedOption === 'rückgabe') return colors.rückgabe;
          const option = options.find(o => o.id === selectedOption);
          return option?.color || colors.weiterleasing;
        };

        if (showConfirmation) {
          const selected = selectedOption === 'rückgabe' 
            ? { title: 'Rückgabe' }
            : options.find(o => o.id === selectedOption);
          const confirmColor = getSelectedColor();
          
          return e('div', { className: 'overlay' },
            e('div', { className: 'confirmation-modal' },
              e('div', {
                className: 'confirmation-icon',
                style: {
                  background: confirmColor.gradient,
                  boxShadow: `0 8px 24px ${confirmColor.primary}4d`,
                }
              }, '✓'),
              e('h2', { className: 'confirmation-title' }, 'Auswahl bestätigt'),
              e('p', { className: 'confirmation-text' },
                'Sie haben ',
                e('strong', null, selected?.title),
                ' gewählt.'
              ),
              e('p', { className: 'confirmation-subtext' },
                'In einem echten System würden Sie jetzt zum nächsten Schritt weitergeleitet.'
              ),
              e('button', { className: 'back-button', onClick: handleBack },
                '← Zurück zur Auswahl'
              )
            )
          );
        }

        const renderOptionCard = (option) => {
          const isSelected = selectedOption === option.id;
          const cardColor = option.color;
          
          return e('div', {
            key: option.id,
            onClick: () => setSelectedOption(option.id),
            className: 'option-card',
            style: {
              borderColor: cardColor.primary,
              background: isSelected || option.highlighted 
                ? `linear-gradient(180deg, ${cardColor.light} 0%, #ffffff 100%)`
                : '#ffffff',
              boxShadow: isSelected 
                ? `0 0 0 3px ${cardColor.primary}33, 0 4px 20px ${cardColor.primary}26`
                : option.highlighted 
                  ? `0 4px 20px ${cardColor.primary}26`
                  : 'none',
            }
          },
            option.badge && e('div', {
              className: 'badge',
              style: {
                background: cardColor.gradient,
                boxShadow: `0 2px 8px ${cardColor.primary}4d`,
              }
            }, option.badge),
            e('div', {
              className: 'radio-outer',
              style: {
                borderColor: isSelected ? cardColor.primary : '#d1d5db',
                background: isSelected ? cardColor.primary : 'transparent',
              }
            },
              isSelected && e('div', { className: 'radio-inner' })
            ),
            e('h3', {
              className: 'option-title',
              style: { color: cardColor.dark }
            }, option.title),
            e('div', { className: 'price-section' },
              e('span', { className: 'price-label' }, option.priceLabel),
              e('div', { className: 'price-row' },
                e('span', {
                  className: 'price',
                  style: { color: cardColor.dark }
                }, option.price),
                e('span', { className: 'price-suffix' }, option.priceSuffix)
              )
            ),
            e('p', { className: 'main-benefit' }, option.mainBenefit),
            e('div', { style: { marginTop: 'auto' } },
              e('div', {
                className: 'divider',
                style: { background: `${cardColor.primary}26` }
              }),
              e('div', {
                style: {
                  minHeight: '44px',
                  marginBottom: '12px',
                  display: 'flex',
                  alignItems: 'center'
                }
              },
                (option.nettoRate || option.paymentInfo) && e('div', {
                  className: 'detail-row',
                  style: {
                    background: `${cardColor.primary}0d`,
                    margin: '0 -12px 0',
                    padding: '8px 12px',
                    borderRadius: '8px',
                    width: 'calc(100% + 24px)',
                  }
                },
                  option.nettoRate ? [
                    e('span', {
                      className: 'detail-label',
                      style: {
                        color: cardColor.dark,
                        fontWeight: '600',
                      }
                    }, 'Mtl. Netto-Belastung'),
                    e('span', {
                      className: 'detail-value',
                      style: {
                        color: cardColor.dark,
                        fontWeight: '700',
                        fontSize: '15px',
                      }
                    }, option.nettoRate)
                  ] : e('span', {
                    className: 'detail-label',
                    style: {
                      color: cardColor.dark,
                      fontWeight: '600',
                      width: '100%',
                      textAlign: 'center',
                    }
                  }, option.paymentInfo)
                )
              ),
              e('div', { className: 'details' },
                e('div', { className: 'detail-row' },
                  e('span', { className: 'detail-label' }, 'Laufzeit'),
                  e('span', { className: 'detail-value' }, option.details.laufzeit)
                ),
                e('div', { className: 'detail-row' },
                  e('span', { className: 'detail-label' }, 'Versicherung'),
                  e('span', { className: 'detail-value' }, option.details.versicherung)
                ),
                e('div', { className: 'detail-row' },
                  e('span', { className: 'detail-label' }, 'Ablöse'),
                  e('span', {
                    className: 'detail-value',
                    style: {
                      color: option.id === 'weiterleasing' ? colors.weiterleasing.primary : '#111827',
                      fontWeight: option.id === 'weiterleasing' ? '700' : '600',
                    }
                  }, option.details.ablöse)
                ),
                e('div', { className: 'detail-row' },
                  e('span', { className: 'detail-label' }, 'Service'),
                  e('span', { className: 'detail-value' }, option.details.service)
                )
              )
            )
          );
        };

        return e('div', { className: 'overlay' },
          e('div', { className: 'modal' },
            e('div', { className: 'header' },
              e('div', { className: 'header-icon' },
                e('img', {
                  src: 'https://raw.githubusercontent.com/alexander-karl/bls-lle-popup-revamp/main/bls-symbol.jpeg',
                  alt: 'BLS Logo',
                  style: {
                    width: '100%',
                    height: '100%',
                    objectFit: 'contain'
                  }
                })
              ),
              e('div', { style: { flex: 1 } },
                e('div', { className: 'header-top-row' },
                  e('h1', { className: 'title' }, 'Leasinglaufzeitende'),
                  e('span', { className: 'user-id' }, 'U15419 – TESTNUTZER BIKELEASING')
                ),
                e('p', { className: 'subtitle' },
                  'Wollen Sie das Rad zum Ende der Leasinglaufzeit übernehmen?'
                )
              )
            ),
            e('div', { className: 'bike-banner' },
              e('span', { className: 'bike-label' }, 'Aktuelles Fahrrad:'),
              e('span', { className: 'bike-name' }, 'Canyon Roadlite:ON 7'),
              e('span', { className: 'bike-end' }, 'Leasingende: 31.03.2025')
            ),
            e('div', { className: 'options-grid' },
              options.map(renderOptionCard)
            ),
            e('div', {
              className: 'return-option',
              style: {
                borderColor: colors.rückgabe.primary,
                background: selectedOption === 'rückgabe' ? colors.rückgabe.light : '#f9fafb',
              },
              onClick: () => setSelectedOption('rückgabe')
            },
              e('div', {
                className: 'radio-outer radio-outer-small',
                style: {
                  borderColor: selectedOption === 'rückgabe' ? colors.rückgabe.primary : '#d1d5db',
                  background: selectedOption === 'rückgabe' ? colors.rückgabe.primary : 'transparent',
                }
              },
                selectedOption === 'rückgabe' && e('div', { className: 'radio-inner' })
              ),
              e('div', { className: 'return-content' },
                e('span', {
                  className: 'return-title',
                  style: {
                    color: selectedOption === 'rückgabe' ? colors.rückgabe.dark : '#374151',
                  }
                }, 'Fahrrad zurückgeben'),
                e('span', { className: 'return-subtitle' },
                  'Sie möchten das Fahrrad nicht behalten? Geben Sie es einfach zurück.'
                )
              ),
              e('svg', {
                className: 'return-arrow',
                style: {
                  color: selectedOption === 'rückgabe' ? colors.rückgabe.primary : '#9ca3af',
                },
                width: '20',
                height: '20',
                viewBox: '0 0 24 24',
                fill: 'none',
                stroke: 'currentColor',
                strokeWidth: '2'
              },
                e('path', { d: 'M9 18l6-6-6-6' })
              )
            ),
            e('div', { className: 'footer' },
              e('p', { className: 'footer-note' },
                'Sie können Ihre Auswahl später noch ändern. Bei Fragen hilft Ihnen unser Support.'
              ),
              e('button', {
                className: 'continue-button',
                style: selectedOption ? {
                  background: getSelectedColor().gradient,
                  cursor: 'pointer',
                  boxShadow: `0 4px 14px ${getSelectedColor().primary}66`,
                } : {},
                disabled: !selectedOption,
                onClick: handleContinue
              },
                selectedOption ? 'Weiter zur Bestätigung' : 'Bitte Option auswählen',
                selectedOption && e('svg', {
                  width: '20',
                  height: '20',
                  viewBox: '0 0 24 24',
                  fill: 'none',
                  stroke: 'currentColor',
                  strokeWidth: '2',
                  style: { marginLeft: '8px' }
                },
                  e('path', { d: 'M5 12h14M12 5l7 7-7 7' })
                )
              )
            )
          )
        );
      };

      // Initialize when React is loaded
      function init() {
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-entry',message:'Init function called',data:{hasReact:typeof React!=='undefined',hasReactDOM:typeof ReactDOM!=='undefined',reactLoaded:window.__reactLoaded,reactDOMLoaded:window.__reactDOMLoaded,rootExists:!!document.getElementById('root')},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'A'})}).catch(()=>{});
        // #endregion
        
        // Wait for both React scripts to load AND be available
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || !window.__reactLoaded || !window.__reactDOMLoaded) {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-retry',message:'React not loaded, retrying',data:{hasReact:typeof React!=='undefined',hasReactDOM:typeof ReactDOM!=='undefined',reactLoaded:window.__reactLoaded,reactDOMLoaded:window.__reactDOMLoaded},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'A'})}).catch(()=>{});
          // #endregion
          setTimeout(init, 100);
          return;
        }
        
        // #region agent log
        fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-before-render',message:'About to render',data:{rootExists:!!document.getElementById('root'),ReactVersion:React.version,ReactDOMVersion:ReactDOM.version},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'D'})}).catch(()=>{});
        // #endregion
        
        try {
          const rootElement = document.getElementById('root');
          if (!rootElement) {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-no-root',message:'Root element not found',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'E'})}).catch(()=>{});
          // #endregion
            return;
          }
          
          const root = ReactDOM.createRoot(rootElement);
          root.render(e(LLEPopup));
          
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-render-success',message:'Render call completed',data:{},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'D'})}).catch(()=>{});
          // #endregion
        } catch (error) {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:init-error',message:'Render error caught',data:{error:error.message,stack:error.stack},timestamp:Date.now(),sessionId:'debug-session',runId:'run2',hypothesisId:'C'})}).catch(()=>{});
          // #endregion
          console.error('Error rendering:', error);
          document.getElementById('root').innerHTML = '<p style="padding: 20px; color: red;">Error: ' + error.message + '</p>';
        }
      }
      
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/f7dabc1b-d286-430a-a2f0-2bad5c857064',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:script-end',message:'Setting up init call',data:{readyState:document.readyState},timestamp:Date.now(),sessionId:'debug-session',runId:'run3',hypothesisId:'D'})}).catch(()=>{});
      // #endregion
      
      // Wait for window load to ensure all scripts are loaded (especially for htmlpreview)
      if (document.readyState === 'complete') {
        // Already loaded, wait a bit more for React scripts
        setTimeout(init, 200);
      } else {
        window.addEventListener('load', function() {
          setTimeout(init, 200);
        });
        // Also try on DOMContentLoaded as fallback
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(init, 200);
          });
        }
      } // End executeApp function
    })();
  </script>
</body>
</html>
